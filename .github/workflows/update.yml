name: Update and deploy

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours: refresh every project
  workflow_dispatch:
  repository_dispatch:
    types: [submission, refresh] # sent by the site: a new submission, or newer progress seen on a page view
  push:
    branches: [main]
    paths-ignore:
      - "data/history/**"
      - "data/submissions/**"
      - "data/slots.json"
      - "data/disputes.json"
      - "data/latest/**"
      - "README.md"
      - "RUNBOOK.md"

# Scheduled/manual runs queue behind each other; every submission gets its own run
# (sharing a group would let GitHub drop queued submissions).
concurrency:
  group: ${{ github.event_name == 'repository_dispatch' && format('{0}-{1}', github.event.action, github.run_id) || 'update' }}
  cancel-in-progress: false

permissions:
  contents: write # commit history, slots and submission results back

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Latest reports are large and can always be re-fetched, so they live in the
      # Actions cache rather than git. History (small, irreplaceable) is committed.
      - name: Restore reports
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/reports
          key: reports-${{ github.run_id }}
          restore-keys: reports-

      - name: Fetch progress from every project's CI
        if: github.event_name != 'repository_dispatch'
        env:
          # A fine-grained token (public repos, read-only) gets a higher rate limit;
          # the built-in token works too.
          GH_TOKEN: ${{ secrets.GH_READ_TOKEN || github.token }}
        run: python3 fetch.py

      - name: Refresh one project
        if: github.event.action == 'refresh'
        env:
          GH_TOKEN: ${{ secrets.GH_READ_TOKEN || github.token }}
          REFRESH_REPO: ${{ github.event.client_payload.repo }}
        run: python3 fetch.py --repo "$REFRESH_REPO"

      - name: Check submitted repository
        if: github.event.action == 'submission'
        env:
          GH_TOKEN: ${{ secrets.GH_READ_TOKEN || github.token }}
          # Passed through the environment, never interpolated into the script.
          SUB_REPO: ${{ github.event.client_payload.repo }}
          SUB_BY: ${{ github.event.client_payload.by }}
          SUB_SYSTEM: ${{ github.event.client_payload.system }}
          SUB_GAME: ${{ github.event.client_payload.game }}
        run: |
          args=("$SUB_REPO" --by "$SUB_BY")
          if [ -n "$SUB_SYSTEM" ]; then args+=(--system "$SUB_SYSTEM" --game "$SUB_GAME"); fi
          python3 submit.py "${args[@]}"

      - name: Save reports
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/reports
          key: reports-${{ github.run_id }}

      - name: Build site
        run: |
          # Take anything newer another run committed meanwhile, so this deploy never puts older data over newer.
          python3 tools/merge_remote.py
          python3 build.py

      - name: Deploy to decomp.fun
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.1 deploy

      - name: Commit results
        env:
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name "decomp.fun bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/submissions data/latest
          # Only the scheduled refresh records slot changes, so concurrent runs never clash on it.
          if [ "$EVENT" != "repository_dispatch" ]; then git add data/slots.json data/disputes.json; fi
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Update progress data"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
